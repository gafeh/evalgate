  - id: remove-length-not-size
    tags: {error_mode: syntax, unit: arraylist, difficulty: hard}
    awards: []
    must_mention: [size]
    note: >
      ArrayList has size(), not length. The logic is otherwise the correct
      backward traversal.
    response: |
      public int removeAll(ArrayList<String> list, String target) {
          int removed = 0;
          for (int i = list.length - 1; i >= 0; i--) {
              if (list.get(i).equals(target)) {
                  list.remove(i);
                  removed++;
              }
          }
          return removed;
      }