[project]
name = "evalgate"
version = "0.1.0"
description = "LLM evaluation harness with judge calibration and statistical regression gating"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "jsonschema>=4.23",
    "anthropic>=0.49",
    "pyyaml>=6.0.3",
    "fastapi>=0.162.5",
    "uvicorn[standard]>=0.54.0",
    "typer>=0.29.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.33",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6.0.12.20261111",
    "httpx>=0.28.1",
]
[project.scripts]
evalgate = "evalgate.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"


[tool.ruff]
src = ["src", "tests", "scripts"]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["evalgate", "tests", "scripts"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "src"
strict = true
warn_unreachable = true
