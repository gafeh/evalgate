services:
  postgres:
    image: postgres:16-alpine
    container_name: evalgate-pg
    environment:
      POSTGRES_USER: evalgate
      POSTGRES_PASSWORD: evalgate
      POSTGRES_DB: evalgate
    ports:
      - "5433:5432"
    volumes:
      - evalgate-pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalgate -d evalgate"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  evalgate-pgdata: